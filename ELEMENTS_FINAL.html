<script type="text/babel">

/* ═══════════ SHARED COMPONENTS ═══════════ */

const Card = ({ children, color = C.border, style = {} }) => (
  <div style={{ background: C.card, border: `1px solid ${color}30`, borderRadius: 14, padding: 24, marginBottom: 8, ...style }}>{children}</div>

const Tag = ({ label, color }) => (

);

const Prose = ({ children, style = {} }) => (

const SmallProse = ({ children, style = {} }) => (

const SectionTitle = ({ children, color = C.text }) => (

const Mono = ({ children, color = C.textDim }) => (

const TabBtn = ({ label, active, onClick, color }) => (

const ElementBadge = ({ symbol, label, color, size = 36 }) => (

        <span key={i} style={{ fontSize: 9, padding: "2px 7px", borderRadius: 4, background: `${color}10`, color: `${color}cc`, border: `1px solid ${color}20`, fontFamily: "'JetBrains Mono', monospace" }}>{d.label}</span>

/* ═══════════ DATA ═══════════ */
const IME_DATA = {
  Ne: { symbol: "Ne", name: "Extraverted Intuition (Potentials)", color: C.Ne,
    subtitle: "Intuition of Ideas (Model A)\nIntuition of Opportunities (Model G)\nIntuition of Alternatives (Talanov)\nIntuition of Possibilities (XYZ)",
    desc: "The engine of curiosity and divergent exploration. Ne scans the informational environment for unrealized possibilities, alternative explanations, and novel connections. It expands the field of consideration by generating options rather than converging on conclusions. Behaviorally: scattered attention, rapid interest-shifts, childlike wonder, inadvertent risk-taking due to weak sensory brakes.",
    dyads: [{ label: "Spontaneity (P)" },{ label: "Extensive (E)" },{ label: "Static (St)" },{ label: "Abstracted (NT)" },{ label: "Implicit (NF)" },{ label: "Generating (A)" },{ label: "Conserving (Δ)" }],
    keywords: ["Novelty","Alternatives","Curiosity","Innovation","Brainstorming","Experiments","Uniqueness"]
  },
  Ni: { symbol: "Ni", name: "Introverted Intuition (Narrative)", color: C.Ni,
    subtitle: "Intuition of Time (Model A)\nIntuition of Change (Model G)\nIntuition of Metamorphosis (Talanov)\nIntuition of Evolution (XYZ)",
    desc: "The faculty of temporal depth and convergent insight. Ni narrows the field of attention to a single essential trajectory: the inevitable unfolding of events. It processes hidden patterns beneath surface reality, generating foresight, premonition, and a sense of personal destiny. Behaviorally: withdrawn absorption, contemplative focus, reluctance to diversify, conviction that one path matters.",
    dyads: [{ label: "Spontaneity (P)" },{ label: "Intensive (I)" },{ label: "Dynamic (Dy)" },{ label: "Abstracted (NT)" },{ label: "Implicit (NF)" },{ label: "Optimizing (Γ)" },{ label: "Mobilizing (Β)" }],
    keywords: ["Foresight","Imagery","Depth","Timing","Inevitability","Destiny"]
  },
  Se: { symbol: "Se", name: "Extraverted Sensing (Kinetics)", color: C.Se,
    subtitle: "Sensation of Force (Model A)\nSensation of Will (Model G)\nSensation of Domination (Talanov)\nSensation of Power (XYZ)",
    desc: "The faculty of volitional force and direct environmental control. Se registers the intensity, pressure, and power dynamics of the immediate physical and social space, then acts to reshape them. It expands the organism's territory, influence, and material resources through assertive confrontation. Behaviorally: bold presence, physical assertiveness, competitive drive, impatience with passivity.",
    dyads: [{ label: "Spontaneity (P)" },{ label: "Extensive (E)" },{ label: "Static (St)" },{ label: "Embedded (SF)" },{ label: "Explicit (ST)" },{ label: "Optimizing (Γ)" },{ label: "Mobilizing (Β)" }],
    keywords: ["Willpower","Dominance","Territory","Assertiveness","Confrontation","Impact"]
  },
  Si: { symbol: "Si", name: "Introverted Sensing (Balance)", color: C.Si,
    subtitle: "Sense of Somatics (Model A)\nSense of Comfort (Model G)\nSense of Homeostasis (Talanov)\nSense of Harmony (XYZ)",
    desc: "The faculty of somatic attunement and environmental harmony. Si registers the body's internal states (comfort, pain, vitality, aesthetic pleasure) and seeks to optimize the equilibrium between organism and environment. It refines sensory experience toward balance rather than intensity. Behaviorally: attention to physical comfort, aesthetic sensitivity, health-consciousness, conflict avoidance.",
    dyads: [{ label: "Spontaneity (P)" },{ label: "Intensive (I)" },{ label: "Dynamic (Dy)" },{ label: "Embedded (SF)" },{ label: "Explicit (ST)" },{ label: "Generating (A)" },{ label: "Conserving (Δ)" }],
    keywords: ["Comfort","Wellbeing","Aesthetics","Relaxation","Harmony","Health"]
  },
  Te: { symbol: "Te", name: "Extraverted Logic (Utility)", color: C.Te,
    subtitle: "Logic of Pragmatism (Model A)\nLogic of Actions (Model G)\nLogic of Benefit (Talanov)\nLogic of Business (XYZ)",
    desc: "The faculty of empirical optimization and resource management. Te accumulates procedural knowledge about how things work in practice, then applies it to maximize productivity, efficiency, and measurable results. It expands the scope of factual information available for action. Behaviorally: industriousness, self-reliance, focus on profit/utility, impatience with theory divorced from application.",
    dyads: [{ label: "Control (J)" },{ label: "Extensive (E)" },{ label: "Dynamic (Dy)" },{ label: "Abstracted (NT)" },{ label: "Explicit (ST)" },{ label: "Optimizing (Γ)" },{ label: "Conserving (Δ)" }],
    keywords: ["Efficiency","Productivity","Facts","Methods","Resources","Optimization"]
  },
  Ti: { symbol: "Ti", name: "Introverted Logic (Structure)", color: C.Ti,
    subtitle: "Logic of Laws (Model A)\nLogic of Relations (Model G)\nLogic of Principles (Talanov)\nLogic of Composition (XYZ)",
    desc: "The faculty of structural analysis and principled consistency. Ti organizes factual information into coherent frameworks, axioms, and classifications, filtering out contradictions and redundancies. It refines understanding toward internal consistency rather than external utility. Behaviorally: systematic reasoning, precision of language, insistence on logical correctness, discomfort with ambiguity.",
    dyads: [{ label: "Control (J)" },{ label: "Intensive (I)" },{ label: "Static (St)" },{ label: "Abstracted (NT)" },{ label: "Implicit (NF)" },{ label: "Generating (A)" },{ label: "Mobilizing (Β)" }],
    keywords: ["Structure","Axioms","Consistency","Classification","Frameworks","Principles"]
  },

    desc: "The faculty of emotional broadcasting and group atmosphere management. Fe registers and modulates the collective emotional field: the mood of a room, the energy of a crowd, the social pressure of a cause. It expands participation by making emotions contagious and inclusive. Behaviorally: expressive warmth or dramatic intensity, social leadership, sensitivity to group morale, discomfort with emotional flatness.",
    dyads: [{ label: "Control (J)" },{ label: "Extensive (E)" },{ label: "Dynamic (Dy)" },{ label: "Embedded (SF)" },{ label: "Implicit (NF)" },{ label: "Generating (A)" },{ label: "Mobilizing (Β)" }],

    desc: "The faculty of interpersonal depth and moral discrimination. Fi registers the quality of relationships (trust, loyalty, attraction, betrayal) and filters social connections through personal ethical standards. It refines the social field by selecting who belongs and who does not. Behaviorally: deep personal attachments, selective trust, strong moral convictions, difficulty with superficial socializing.",

/* ═══════════ MAIN APP ═══════════ */
function FunctionsReport() {
  const [activeSection, setActiveSection] = useState("overview");

  const sections = [
    { id: "overview", label: "Overview", color: C.teal },
    { id: "elements", label: "Eight Info-Elements", color: C.accent3 },
    { id: "energetics", label: "Four Energetic Rhythms", color: C.accent1 },
    { id: "aspects", label: "Four Jungian Aspects", color: C.accent2 },
    { id: "axes", label: "Four Quadra Axes", color: C.rose },
    { id: "dichotomies", label: "Dichotomies", color: C.accent4 },
  ];

  return (
    <div style={{ fontFamily: "'Inter', -apple-system, sans-serif", background: C.bg, color: C.text, minHeight: "100vh", padding: "0 0 60px" }}>

      {/* ═══════════ HERO ═══════════ */}
      <div style={{ background: `radial-gradient(ellipse at 20% 0%, ${C.Ne}06, transparent 55%), radial-gradient(ellipse at 80% 0%, ${C.Ti}06, transparent 55%), radial-gradient(ellipse at 50% 100%, ${C.Fe}05, transparent 50%)`, padding: "48px 28px 36px", borderBottom: `1px solid ${C.border}`, textAlign: "center" }}>
        <Mono color={C.accent1}>Section VI · IME Primer</Mono>
        <h1 style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: "clamp(26px, 5vw, 40px)", fontWeight: 700, lineHeight: 1.15, margin: "14px 0", background: `linear-gradient(135deg, ${C.text}, ${C.textMuted})`, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>
          Information Metabolism Elements
        </h1>
        <div style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: "clamp(16px, 3vw, 22px)", color: C.textMuted, fontStyle: "italic", marginBottom: 16 }}>The Valleys of Cognitive Processing</div>
        <Prose style={{ maxWidth: 700, margin: "0 auto 18px", textAlign: "center" }}>
          A comprehensive analysis of the eight information metabolism elements (IMEs), explored through their associated dichotomies and these three organizing concepts: Energetics (how they operate), Aspects (what domain they target), and Axes (how they complement each other in quadra values).
        </Prose>
        <div style={{ display: "flex", justifyContent: "center", gap: 8, flexWrap: "wrap" }}>
          {["Eight Info-Elements", "Four Energetic Rhythms", "Four Jungian Aspects", "Four Quadra Axes", "Dichotomies"].map((l, i) => (
            <Tag key={i} label={l} color={[C.accent3, C.accent1, C.accent2, C.rose, C.accent4][i]} />
          ))}
        </div>
      </div>

      <div className="tab-strip">
        {sections.map(s => (
          <TabBtn key={s.id} label={s.label} active={activeSection === s.id} onClick={() => setActiveSection(s.id)} color={s.color} />
        ))}
      </div>

      <div style={{ maxWidth: 920, margin: "0 auto", padding: "0 20px" }}>
        {/* ═══════════ OVERVIEW ═══════════ */}
        {activeSection === "overview" && <>
          <Divider label="What Are Information Metabolism Elements?" color={C.teal} />

          <Card>
            <SectionTitle>Three Organizing Concepts</SectionTitle>
            <Prose>
              The eight IMEs (referred to simply as "functions" by Talanov) are not an arbitrary set. They emerge from the intersection of three binary classifications, yielding exactly 2³ = 8 categories. These classifications also produce three natural ways to group the elements into pairs, each corresponding to a major structural layer of the Socion:
            </Prose>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 2, background: C.border, borderRadius: 10, overflow: "hidden", marginBottom: 16 }}>
              {[
                { label: "Energetics", desc: "Je · Pe · Ji · Pi", color: C.accent1, sub: "How it operates", detail: "Pairs opposite aspects that share the same processing mode; generates Temperament groups" },
                { label: "Aspects", desc: "T · N · F · S", color: C.accent2, sub: "What domain it targets", detail: "Pairs same-aspect elements that differ in E/I; generates Club groups" },
                { label: "Axes", desc: "Dec · Mer · Ser · Jud", color: C.rose, sub: "What it complements", detail: "Pairs complementary elements that share quadra values; generates Quadra groups" },
              ].map((cell, i) => (
                <div key={i} style={{ background: C.card, padding: "16px 12px", textAlign: "center" }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: cell.color, marginBottom: 4 }}>{cell.label}</div>
                  <Mono>{cell.desc}</Mono>
                  <div style={{ fontSize: 11, color: C.textMuted, fontStyle: "italic", marginTop: 6 }}>{cell.sub}</div>
                  <div style={{ fontSize: 10, color: C.textDim, marginTop: 6 }}>{cell.detail}</div>
                </div>
              ))}
            </div>
            <SmallProse>
              Each IME is uniquely defined by its position in all three concepts. Ne is simultaneously a <em>Pe</em> element (energetic/spontaneous processing), an <em>N</em> element (intuitive domain), and a member of the <em>Judicious axis</em> (Ne+Si, the divergent perceptual pair). No other element shares all three memberships. The three concepts are not redundant: they capture genuinely different structural properties that converge on the same eight entities from different angles.
            </SmallProse>
          </Card>

          <Card>
            <SectionTitle color={C.teal}>Attentional Basins of Cognitive Structure</SectionTitle>
            <Prose>
              Information Metabolism Elements (IMEs) are the eight fundamental categories of information that the human psyche is structured to process. Each IME represents a distinct <em>attentional basin</em>: a stable cognitive configuration in which perceptual resources, evaluative frameworks, and behavioral outputs are organized to handle a specific domain of reality. They are not merely "preferences" in the colloquial sense; they are structural features of how the mind carves the informational world into processable chunks.
            </Prose>
            <Prose>
              The concept originates from Antoni Kepinski's theory of information metabolism: the idea that the psyche operates like a thermodynamic open system, receiving energy-information from the environment, metabolizing it through specialized processing structures, and converting it back into action. Aushra Augusta's central insight (c. 1968) was to identify Jung's eight function-attitudes as corresponding to eight <em>aspects of objective reality</em> that every psyche must process, with each sociotype handling them in a different structural configuration. Her resulting model, Model A (1978), placed all eight elements into an 8-position functional architecture with specific rules governing their arrangement, generating exactly 16 types.
            </Prose>
            <Prose>
              Working alongside Augusta in the early development of Socionics was Victor Gulenko, who went on to become the most prolific contributor to the theory's evolution. Gulenko founded the Humanitarian Socionics School (HSS) in Kiev and shifted the theory's emphasis from purely informational processing toward the integration of <em>energy budgeting and utilization</em> alongside information flow. Where other schools continued to focus primarily on how humans perceive and process information (informational metabolism), HSS highlighted attention on human behavior and performance (energy metabolism). This dual emphasis produced two of Gulenko's most significant contributions: Model G, an alternative functional model that foregrounds the energy dynamics between functions, and the DCNH subtype system (Dominant, Creative, Normalizing, Harmonizing), which treats each of the 16 types as having four continuous subtype variations rather than being monolithic categories.
            </Prose>
            <Prose>
              Modern approaches have since incorporated updated alignment with current knowledge of personality science, neuroendocrinology, cybernetics, and motivation theory. Perhaps the most consequential of these developments is the factor-analytically-anchored work of Viktor Talanov (via socionavigator.com) and the sociotype.xyz platform (see sociotype.xyz/2025 for a broad synopsis). Their data-first, continuous-measurement approach consolidates the structural models more formally while improving the quality of semantic descriptions through ongoing large-scale questionnaire participation and statistical denoising. Sociotype.xyz describes its methodology as extracting the most consistent intersections from collective type images, filtering out noise, and forming stable correlations purely mathematically, with descriptions evolving to align with factor-analytically derived data.
            </Prose>
            <Prose>
              It is important to understand that leading practitioners of Socionics today do not approach type as rigidly as the classical 2×4 grid of Model A might suggest. Gulenko's DCNH system explicitly treats subtypes as continuous modulations, not discrete bins. Each person occupies a position on a spectrum within their type, with their subtype profile reflecting which functions are accentuated and to what degree. Gulenko's communicative distances framework similarly treats social behavior as a gradient phenomenon, not a fixed output.
            </Prose>
            <Prose>
              Talanov's empirical approach reinforces this: his questionnaire-derived profiles show that each dichotomy, measured individually, distributes as a continuous bell curve across the population. There are no hard walls between "Intuitive" and "Sensor." However, the dichotomies are not independent of each other. They intercorrelate, meaning that certain trait combinations co-occur far more often than chance would predict. In the joint, multi-dimensional space of all dichotomies together, these intercorrelations create 16 regions of statistical clustering, stable configurations where large numbers of people converge. These clusters are the types. Sociotype.xyz measures personality along continuous dichotomy spectra rather than sorting into categorical boxes, and its intercorrelation data (sociotype.xyz/dcor) demonstrates precisely how the correlational structure between dichotomies generates the type clusters from continuous inputs.
            </Prose>
            <Prose>
              The result is that type functions as an attractor state in the dynamical-systems sense. Each dichotomy axis is continuous (a bell curve when viewed in isolation), but the correlations between axes create valleys in the joint trait landscape, regions the psyche gravitates toward and tends to stay within. The type is real in the way a valley in a landscape is real: it is a stable configuration that the system tends toward, but the system is never frozen at the exact center. It moves, oscillates, and shifts position within the basin as development, context, and subtype accentuation modulate the profile. Under sufficient pressure, the system can even shift toward an adjacent basin, but it resists doing so because the correlational structure holds it in place.
            </Prose>
            <Prose style={{ marginBottom: 0 }}>
              Crucially, every person possesses all eight IMEs. They differ not in which elements they have, but in the <em>functional position</em> each element occupies. Position determines strength, priority, valuation, and behavioral expression. The same IME in the Base function versus the Vulnerable function produces radically different cognitive and behavioral profiles.
            </Prose>
          </Card>

          <Card>
            <SectionTitle>The Structuring Dichotomies</SectionTitle>
            <Prose>
              The eight IMEs are structured by seven elemental dichotomies, binary properties that partition the elements into meaningful groups. Three of these are <em>universal</em> (Spontaneity/Control, Extensive/Intensive, Static/Dynamic): they apply to all eight elements regardless of aspect or quadra, which is why the Energetic/Temperament dichotomies are so fundamental. Two additional dichotomies capture the higher-order partitions corresponding to Club structure, and two more encode Quadra-value partitions.
            </Prose>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 14 }}>
              <LensCard lens="Spontaneity (P) / Control (J)" color={C.teal}
                content="Formerly known as Irrational/Rational. Spontaneity elements (also referred to as &quot;Survival&quot; by Talanov) register perceptions: Ne, Ni, Se, Si track what is and what could be in phenomenological space, orienting the organism toward opportunities and threats before any evaluation occurs. Control elements (Te, Ti, Fe, Fi) encode judgments: they evaluate, categorize, and decide, imposing symbolic structure onto the raw perceptual field. This is the fundamental divide between perceiving and judging, between referents and the symbols that represent them." />
              <LensCard lens="Extensive (E) / Intensive (I)" color={C.accent4}
                content="Extensive elements (Ne, Se, Te, Fe) expand the quantity of information by accumulating more of it, projecting outward toward phenomenological objects. Intensive elements (Ni, Si, Ti, Fi) refine the quality of information by filtering, drawing inward toward interrelationships. This dichotomy determines the Bold/Cautious function placement in Model A. The use of Extensive/Intensive at the element level helps prevent conflating the focus vectors of Socionics elements with Extraversion as understood in the Big Five or MBTI. The corresponding Reinin dichotomy (Extraverted/Introverted), which operates at the type level, aligns more closely with the colloquial understanding of those terms." />
              <LensCard lens="Static (St) / Dynamic (Dy)" color={C.accent3}
                content="Static elements (Ne, Se, Ti, Fi) capture discrete states, potentials, and distances: snapshot cognition that perceives reality as comprised of distinct parts. Dynamic elements (Ni, Si, Te, Fe) track continuous flows, transitions, and processes: streaming cognition that perceives reality as an evolving whole. This dichotomy determines the composition of the Mental and Vital rings in Model A." />
              <LensCard lens="Abstracted (NT) / Embedded (SF)" color={C.accent2}
                content="Abstracted elements (Ne, Ni, Te, Ti) operate at cognitive distance from visceral experience, processing information mentally and removed from immediate pleasure/pain signals. Embedded elements (Se, Si, Fe, Fi) operate at close range, processing through embodied, visceral experience. This partitions the NT elements from the SF elements, mapping to the Information vs. Energy axis in Socionics' energy-information duality." />
              <LensCard lens="Implicit (NF) / Explicit (ST)" color={C.rose}
                content="Implicit elements (Ne, Ni, Fe, Fi) deal with information that is subjectively interpreted: possibilities, hidden patterns, emotional atmospheres, and relational attitudes all require inference beyond the literal signal. Explicit elements (Se, Si, Te, Ti) deal with information that is objectively ascertained: physical properties, measurable data, territorial dynamics, and procedural facts are directly observable. This partitions the NF elements from the ST elements." />
              <LensCard lens="Generating (A) / Optimizing (Γ)" color={C.judicious}
                content="Generating elements (Ne, Si, Ti, Fe) are the Alpha-valued set, associated with divergent exploration, cooperative resource-processing, and cyclic temporal perception. Optimizing elements (Ni, Se, Te, Fi) are the Gamma-valued set, associated with convergent exploitation, competitive resource-processing, and focused goal-pursuit. Alpha and Gamma are each other's opposing quadras, maximally different in valued elements." />
              <LensCard lens="Conserving (Δ) / Mobilizing (Β)" color={C.serious}
                content="Conserving elements (Ne, Si, Te, Fi) are the Delta-valued set, associated with practical individuation, tradition-based stability, and judicious-serious discourse. Mobilizing elements (Ni, Se, Ti, Fe) are the Beta-valued set, associated with collective intensity, hierarchical drive, and decisive-merry discourse. Delta and Beta are each other's opposing quadras, maximally different in valued elements." />
            </div>
          </Card>
        </>}

        {/* ═══════════ ENERGETICS ═══════════ */}
        {activeSection === "energetics" && <>
          <Divider label="Four Energetic Rhythms: The Temperament Dyads" color={C.accent1} />
          <Card>
            <SectionTitle color={C.accent1}>The Most Fundamental Partition</SectionTitle>
            <Prose>
              Before an element's domain (Logic, Ethics, Intuition, Sensing) or its quadra affiliation matters, it must first be characterized by <em>how it processes</em>: its energetic mode. The four Energetic dyads pair elements that are opposite in aspect but identical in their metabolic signature. Ne and Se are both Extraverted Irrationals: spontaneous, expansive perceptual processors, despite targeting completely different information domains. Ti and Fi are both Introverted Rationals: refined, concentrated evaluative processors, despite judging by entirely different standards.
            </Prose>
            <Prose>
              These are the primary <em>counterpart</em> pairs: Ne↔Se, Ni↔Si, Te↔Fe, Ti↔Fi. They represent two opposite approaches to the same fundamental mode of cognitive operation. Talanov's interfunctional correlation data confirms this: elements within the same Energetic dyad show the strongest <em>negative</em> correlation with each other (they are the primary functional opponents), while showing moderate positive correlation with members of the <em>same</em> dyad across the E/I divide.
            </Prose>
            <Prose style={{ marginBottom: 0 }}>
              Each Quadra and each Club contains exactly one element from each Energetic dyad, they require all four modes to be structurally complete. The four Energetics also correspond precisely to the four Socionics Temperament groups when mapped through leading functions: Pe-leading types are EP (Flexible-Turning), Pi-leading types are IP (Receptive-Adaptive), Je-leading types are EJ (Linear-Assertive), and Ji-leading types are IJ (Balanced-Stable).
            </Prose>
          </Card>

            <DyadCard name="Extraverted Perceiving" code="Pe" elements="Ne+Se (Exploration)" color={C.Pe}

            <DyadCard name="Introverted Perceiving" code="Pi" elements="Ni+Si (Attunement)" color={C.Pi}

              On the Socionics Torus (Joynton), the eight IMEs are arranged such that Energetic counterparts occupy <em>antipodal</em> positions: Ne is maximally distant from Se, Ti from Fi, etc. This geometric fact encodes the fundamental opposition: counterparts compete for the same processing mode. If Ne is strongly activated, Se is suppressed (and vice versa), because both demand the same explorative Extraverted-Irrational (Pe) processing channel. This is why the Jungian Axis in Model A (positions 1↔7, Base↔Ignoring; these element placement labels and numbers will be discussed further in the next installment specifically on the Models) always pairs Energetic counterparts. The Base function's dominance necessarily suppresses its counterpart to the Ignoring position.
            </Prose>

        </>}

        {/* ═══════════ ASPECTS ═══════════ */}

            <Prose>
              Where Energetics capture <em>how</em> an element operates, Aspects capture <em>what ontological domain</em> it targets. The four Jungian Aspects (Intuition, Sensing, Logic, Ethics) represent the four irreducible categories of information about reality. Each Aspect contains exactly two elements (one Extraverted, one Introverted) that process the same domain but with opposite directionality: expanding quantity versus refining quality.
            </Prose>
            <Prose>
              The Aspect dyads are the basis for the four Socionics Clubs: types leading with the same Aspect share a cognitive domain and vocational orientation. The two Aspect dichotomies, N/S (Imagination/Sense) and T/F (Calculation/Suggestion), are the primary axes of Talanov's Strength triad, jointly determining what a type <em>can</em> do.
            </Prose>
          </Card>

            </Prose>
          </Card>
        </>}

        {/* ═══════════ AXES ═══════════ */}

            <SectionTitle color={C.rose}>Complementary Dyads and Quadra Values</SectionTitle>
            <Prose>
              The Axes are the most emergent and encompassing pairing framework. Each Axis pairs two elements from <em>different</em> Energetic dyads <em>and</em> different Aspects, creating a dyad whose members are complementary rather than competitive. Where Energetic counterparts (Ne↔Se) fight for the same processing channel, Axis partners (Ne+Si) form a communication feedback loop: one generates referents while the other encodes them into symbols (or vice versa), completing a full information metabolism cycle.
            </Prose>
            <Prose>
              Vincent's Information Axes paper grounds this in semiotics: rational elements are <em>symbols</em> (intensional representations) and irrational elements are <em>referents</em> (extensional phenomena). A symbol without a referent is empty; a referent without a symbol is unknowable. The Axes pair symbols with their natural referents, creating the four information-metabolism feedback loops that define quadra values. Each Quadra values exactly two of these four Axes.
            </Prose>
            <Prose style={{ marginBottom: 0 }}>
              These dyads also facilitate the emergence of higher-order properties: feedback loops (the sender-receiver cycle), fulfillment needs (what a type's weak Axis partner craves from its dual), and growth trajectories (how the Axis develops across the lifespan). They are the building blocks from which Quadra values, and by extension, all intertype relations, are constructed.
            </Prose>
          </Card>

            <DyadCard name="Merry" code="Fe/Ti" elements="Universalization" color={C.merry}

            <SectionTitle>How Axes Construct Quadras</SectionTitle>
            <Prose>
              Each Quadra is defined by valuing one perceptual Axis and one evaluative Axis. The intersection uniquely determines the quadra:
            </Prose>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 2, background: C.border, borderRadius: 10, overflow: "hidden", marginBottom: 16 }}>
              {[

                { q: "Beta (Β)", a1: "Decisive", a2: "Merry", c1: C.decisive, c2: C.merry, el1: "Se+Ni", el2: "Ti+Fe" },

        {/* ═══════════ DICHOTOMIES ═══════════ */}
        {activeSection === "dichotomies" && <>
          <Divider label="Elemental Dichotomies" color={C.accent4} />
          <Card>

            </Prose>
            <Prose>
