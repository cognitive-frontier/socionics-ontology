  const [tab,_setTab]=useState(()=>{try{return localStorage.getItem("ontology-sec-models")||"overview";}catch(e){return "overview";}});
  const setTab=(v)=>{try{localStorage.setItem("ontology-sec-models",v);}catch(e){}_setTab(v);};
  const [sel,setSel]=useState("ILE");
  const t=TYPES[sel];
  const ac=TABS.find(x=>x.id===tab)?.color||C.accent;

  return(<div style={{minHeight:"100vh",background:C.bg,paddingBottom:60}}>
    <div style={{background:`linear-gradient(180deg,${ac}08 0%,transparent 100%)`,borderBottom:`1px solid ${C.border}`,padding:"38px 24px 24px",textAlign:"center"}}>
      <div style={{fontFamily:"'JetBrains Mono', monospace",fontSize:11,color:C.textDim,marginBottom:10}}>Section VII · Models Primer</div>
      <h1 style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:34,fontWeight:700,margin:0,color:"#ffffff",letterSpacing:0.3}}>Socionics Model Architecture</h1>
      <div style={{fontFamily:"'Crimson Text','Playfair Display',Georgia,serif",fontSize:15,fontStyle:"italic",color:C.textMuted,marginTop:8,letterSpacing:0.2}}>Information Metabolism (Model A) & Energy Metabolism (Model G)</div>
    </div>
    <div style={{padding:"14px 20px",borderBottom:`1px solid ${C.border}55`,display:"flex",flexDirection:"column",gap:7,alignItems:"center"}}>
      {QUADRA_ORDER.map(q=>(<div key={q} style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:11,fontWeight:800,color:QC[q],width:56,textAlign:"right",letterSpacing:0.5}}>{q}</span>
        <div style={{display:"flex",gap:4}}>
          {QT[q].map(tk=>(<button key={tk} onClick={()=>setSel(tk)} style={{
            padding:"5px 11px",borderRadius:5,border:"none",fontSize:12,fontWeight:700,
            fontFamily:"'JetBrains Mono',monospace",transition:"all 0.15s",
            background:sel===tk?ac:"rgba(255,255,255,0.05)",color:sel===tk?"#fff":C.textDim,
          }}>{tk}</button>))}
        </div>
      </div>))}
    </div>
    <div className="type-header" style={{padding:"9px 20px",background:"rgba(255,255,255,0.015)",borderBottom:`1px solid ${C.border}44`,display:"flex",justifyContent:"center",gap:10,flexWrap:"wrap",alignItems:"center"}}>
      <span style={{fontSize:13,fontWeight:700,color:C.text}}>{sel}: {t.l}</span>
      <span style={{fontSize:13,color:C.textFaint}}>|</span>
      <span style={{fontSize:13,color:C.accentA}}>Ego: {t.b}+{t.c}</span>
      <span style={{fontSize:13,color:C.accentG}}>Mission: {t.b}+{t.d}</span>
      <span style={{fontSize:13,color:C.textMuted,fontFamily:"'JetBrains Mono',monospace"}}>({t.b}-{t.c[0]}x)</span>
    </div>
    <div style={{padding:"0 20px",borderBottom:`1px solid ${C.border}55`,overflowX:"auto"}}>
      <div style={{display:"flex",gap:2,width:"max-content",margin:"0 auto"}}>
      {TABS.map(tb=>(<button key={tb.id} onClick={()=>setTab(tb.id)} style={{
        padding:"13px 22px",border:"none",fontSize:13,fontWeight:700,background:"transparent",
        color:tab===tb.id?tb.color:C.textFaint,borderBottom:tab===tb.id?`2px solid ${tb.color}`:"2px solid transparent",
        transition:"all 0.2s",whiteSpace:"nowrap",letterSpacing:0.5,cursor:"pointer",
      }}>{tb.label}</button>))}
      </div>
    </div>
    <div style={{padding:"28px 24px",maxWidth:900,margin:"0 auto"}}>
      {tab==="overview"&&<OverviewSection/>}
      {tab==="modelA"&&<div>
        <SectionDivider label="Model A: Information Metabolism" color={C.accentA}/>
        <p style={{fontSize:13,color:C.textDim,marginBottom:14,textAlign:"center"}}>Click any function position to expand its full dichotomy profile and description.</p>
        <ModelAVisualizer type={sel}/>
        {PROFILES[sel]&&PROFILES[sel].portraitA&&<Card style={{marginTop:18,borderColor:C.accentA+"55"}}>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,fontWeight:700,color:C.accentA,letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>Model A Sub-Portrait</div>
          <div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:18,fontWeight:700,color:C.text,marginBottom:4}}>Informational Anatomy: {sel}</div>
          <div style={{fontFamily:"'Crimson Text',Georgia,serif",fontSize:12,fontStyle:"italic",color:C.textDim,marginBottom:12,lineHeight:1.55}}>An information-metabolism cross-section organized by Model A's four horizontal blocks. Read alongside the Model G sub-portrait: both describe the same psyche from orthogonal angles, not as competing accounts.</div>
          <p style={{fontSize:13.5,color:C.textMuted,lineHeight:1.78,fontFamily:"'Crimson Text',Georgia,serif",whiteSpace:"pre-wrap"}}>{PROFILES[sel].portraitA}</p>
        </Card>}
      </div>}
      {tab==="modelG"&&<div>
        <SectionDivider label="Model G: Energy Metabolism" color={C.accentG}/>
        <p style={{fontSize:13,color:C.textDim,marginBottom:14,textAlign:"center"}}>Click any function position to expand its full dichotomy profile and description.</p>
        <ModelGVisualizer type={sel}/>
        {PROFILES[sel]&&PROFILES[sel].portraitG&&<Card style={{marginTop:18,borderColor:C.accentG+"55"}}>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,fontWeight:700,color:C.accentG,letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>Model G Sub-Portrait</div>
          <div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:18,fontWeight:700,color:C.text,marginBottom:4}}>Energetic Anatomy: {sel}</div>
          <div style={{fontFamily:"'Crimson Text',Georgia,serif",fontSize:12,fontStyle:"italic",color:C.textDim,marginBottom:12,lineHeight:1.55}}>An energy-metabolism cross-section organized by Model G's four horizontal blocks. The same eight functions occupy both models; only the blocking and the question being asked differ. This is the second projection of the same psyche, not an alternative one.</div>
          <p style={{fontSize:13.5,color:C.textMuted,lineHeight:1.78,fontFamily:"'Crimson Text',Georgia,serif",whiteSpace:"pre-wrap"}}>{PROFILES[sel].portraitG}</p>
        </Card>}
      </div>}
      {tab==="portrait"&&<div>
        <SectionDivider label="Type Portrait" color={C.rose}/>
        <PortraitSection type={sel}/>
      </div>}
      {tab==="cube"&&<div>
        <SectionDivider label="The Presence Cube" color={C.violet}/>
        <PresenceCubeSection/>
      </div>}
    </div>
    <div style={{textAlign:"center",padding:"36px 20px 14px",color:C.textFaint,fontSize:11,letterSpacing:0.5}}>
      <div>The Complete Socionics Ontology · Models, Architecture & Type Portraits</div>
      <div style={{marginTop:4}}>Sources: sociotype.xyz · wikisocion · opensocionics · bestsocionics · varlawend</div>
    </div>
  </div>);
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
