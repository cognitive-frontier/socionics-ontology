// ─── SOCION CLOCK SVG ─────────────────────────────────────────────

const SocionClock = ({ highlight }) => {
  const cx = 200, cy = 200, r = 160, ir = 100;
  const quadras = [
    { key: "alpha", label: "Α", angle: -90, color: C.alpha },
    { key: "beta", label: "Β", angle: 0, color: C.beta },
    { key: "gamma", label: "Γ", angle: 90, color: C.gamma },
    { key: "delta", label: "Δ", angle: 180, color: C.delta },
  ];
  const toRad = d => d * Math.PI / 180;
  return (
    <svg viewBox="-40 -25 480 450" style={{ width: "100%", maxWidth: 360 }}>
      {/* outer ring */}
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={C.border} strokeWidth={1} />
      <circle cx={cx} cy={cy} r={ir} fill="none" stroke={C.border} strokeWidth={0.5} strokeDasharray="4 4" />
      {/* quadrant arcs */}
      {quadras.map((q, i) => {
        const startA = toRad(q.angle - 45);
        const endA = toRad(q.angle + 45);
        const mr = (r + ir) / 2;
        const sx = cx + r * Math.cos(startA), sy = cy + r * Math.sin(startA);
        const ex = cx + r * Math.cos(endA), ey = cy + r * Math.sin(endA);
        const isx = cx + ir * Math.cos(endA), isy = cy + ir * Math.sin(endA);
        const iex = cx + ir * Math.cos(startA), iey = cy + ir * Math.sin(startA);
        const opacity = highlight === q.key ? 0.25 : 0.08;
        return (
          <g key={q.key}>
            <path d={`M ${sx} ${sy} A ${r} ${r} 0 0 1 ${ex} ${ey} L ${isx} ${isy} A ${ir} ${ir} 0 0 0 ${iex} ${iey} Z`} fill={q.color} opacity={opacity} />
            <text x={cx + mr * Math.cos(toRad(q.angle))} y={cy + mr * Math.sin(toRad(q.angle)) + 6} textAnchor="middle" fontSize="24" fontWeight="800" fill={q.color} opacity={highlight === q.key ? 1 : 0.5} fontFamily="'Playfair Display', Georgia, serif">{q.label}</text>
          </g>
        );
      })}
      {/* arrows between quadras (rotated tangent to circle, pointing clockwise) */}
      {quadras.map((q, i) => {
        const next = quadras[(i + 1) % 4];
        const midAdeg = (q.angle + next.angle) / 2 + (i === 3 ? 180 : 0);
        const midA = toRad(midAdeg);
        const ax = cx + (r - 20) * Math.cos(midA), ay = cy + (r - 20) * Math.sin(midA);
        const rot = midAdeg + 90;
        return <text key={`arr${i}`} x={ax} y={ay} textAnchor="middle" dominantBaseline="central" fontSize="22" fontWeight="700" fill={C.textDim} opacity={0.8} transform={`rotate(${rot} ${ax} ${ay})`}>→</text>;
      })}
      {/* center label */}
      <text x={cx} y={cy - 7} textAnchor="middle" fontSize="14" fontWeight="700" fill={C.textDim} letterSpacing="3" fontFamily="'JetBrains Mono', monospace">SOCION</text>
      <text x={cx} y={cy + 13} textAnchor="middle" fontSize="14" fontWeight="700" fill={C.textDim} letterSpacing="3" fontFamily="'JetBrains Mono', monospace">CLOCK</text>
      {/* season labels: TOP/BOTTOM stack radially, LEFT/RIGHT stack vertically (sub above main) to clear the Greek letters at mr */}
      {[
        {a:-90,l:"GENESIS",s:"spring",c:C.alpha,vertical:false},
        {a:0,l:"MOBILIZE",s:"summer",c:C.beta,vertical:true},
        {a:90,l:"OPTIMIZE",s:"autumn",c:C.gamma,vertical:false},
        {a:180,l:"CONSERVE",s:"winter",c:C.delta,vertical:true},
      ].map((s,i)=>{
        const ang = toRad(s.a);
        // Horizontal cardinals (LEFT/RIGHT) get pushed further out so CONSERVE/MOBILIZE clear the donut entirely
        const mainOffset = s.vertical ? 38 : 22;
        const mainX = cx + (r+mainOffset)*Math.cos(ang);
        const mainY = cy + (r+mainOffset)*Math.sin(ang) + 4;
        // sub: radial offset for top/bottom, vertical (above) for left/right
        const subX = s.vertical ? mainX : cx + (r+38)*Math.cos(ang);
        const subY = s.vertical ? mainY - 14 : cy + (r+38)*Math.sin(ang) + 4;
        return (
          <g key={i}>
            <text x={mainX} y={mainY} textAnchor="middle" fontSize="12" fill={s.c} letterSpacing="1" fontFamily="'JetBrains Mono', monospace" opacity={0.95} fontWeight="700">{s.l}</text>
            <text x={subX} y={subY} textAnchor="middle" fontSize="10" fill={s.c} fontFamily="'JetBrains Mono', monospace" opacity={0.55} fontStyle="italic">{s.s}</text>
          </g>
        );
      })}
    </svg>
  );
};

// ─── ENERGY FLOW DIAGRAM ──────────────────────────────────────────

const EnergyDiagram = () => {

  const phases = [
    { x: 0, label: "Α", sub: "Potential", color: C.alpha, eH: 95, iH: 20 },
    { x: 0.25, label: "Β", sub: "Kinetic", color: C.beta, eH: 75, iH: 55 },
    { x: 0.5, label: "Γ", sub: "Harvest", color: C.gamma, eH: 40, iH: 80 },
    { x: 0.75, label: "Δ", sub: "Conserve", color: C.delta, eH: 20, iH: 95 },
  ];
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", maxWidth: 560 }}>
      {/* energy line */}
      <polyline points={phases.map(p => `${pad + p.x * pw},${h - 10 - p.eH * 0.9}`).join(" ")} fill="none" stroke={C.accent4} strokeWidth={2} opacity={0.7} />

      <polyline points={phases.map(p => `${pad + p.x * pw},${h - 10 - p.iH * 0.9}`).join(" ")} fill="none" stroke={C.accent2} strokeWidth={2} opacity={0.7} />
      {phases.map((p, i) => (
        <g key={i}>
          <circle cx={pad + p.x * pw} cy={h - 10 - p.eH * 0.9} r={4} fill={C.accent4} />
          <circle cx={pad + p.x * pw} cy={h - 10 - p.iH * 0.9} r={4} fill={C.accent2} />
          <text x={pad + p.x * pw} y={h - 2} textAnchor="middle" fontSize="12" fontWeight="800" fill={p.color} fontFamily="'JetBrains Mono', monospace">{p.label}</text>
        </g>
      ))}
      <text x={w - 10} y={15} textAnchor="end" fontSize="8" fill={C.accent4} fontFamily="'JetBrains Mono', monospace">ENERGY</text>
      <text x={w - 10} y={25} textAnchor="end" fontSize="8" fill={C.accent2} fontFamily="'JetBrains Mono', monospace">INFORMATION</text>
    </svg>
  );
};

          </div>
          <Card style={{ marginTop: 12, background: `${C.accent3}06`, border: `1px solid ${C.accent3}18` }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: C.accent3, letterSpacing: 2, textTransform: "uppercase", marginBottom: 8, fontFamily: "'JetBrains Mono', monospace" }}>Cross-System Convergence</div>
            <SmallProse style={{ color: C.textMuted }}>The Cooperation/Competition axis converges across multiple independent personality frameworks. Talanov's Judicious pole correlates with Big Five Agreeableness (both the Compassion and Politeness facets of DeYoung's model), HEXACO Honesty-Humility and Agreeableness (vs. Anger), and Cloninger's Cooperativeness dimension from his Temperament and Character Inventory (TCI). The Decisive pole inversely correlates with these same traits and additionally loads on facets associated with HEXACO low Emotionality (fearlessness, toughness) and Big Five low Neuroticism (stress tolerance under confrontation). This convergence suggests the Cooperation/Competition axis taps a deep biological dimension of social-positioning strategy, one that independently shapes quadra values, vocational fit, and political orientation.</SmallProse>
          </Card>
          <Prose style={{ marginTop: 12 }}>Ti/Fe vs. Te/Fi (the Ascending/Descending axis) adds the second dimension: the ascending quadras (Alpha, Beta) share <strong>universalist communication</strong>, integrating people into common emotional spaces (Fe) and common logical frameworks (Ti). The descending quadras (Gamma, Delta) share <strong>particularist communication</strong>, differentiating people by personal attitude (Fi) and information by practical utility (Te). Together, Cooperation/Competition and Universalism/Particularism form the two independent axes of the quadra-value space.</Prose>
        </Card>
      </>}

      {/* ═══════════════ THERMODYNAMICS ═══════════════ */}
      {activeSection === "thermo" && <>
        <Divider label="Thermodynamic & Entropic Analysis" color={C.rose} />
        <Card>
          <SectionTitle color={C.rose}>The Quadra Cycle as Energy Metabolism</SectionTitle>
          <Prose>Gulenko's deepest insight is that the socion-clock models a <strong>thermodynamic cycle</strong>: energy and information are inversely traded as a system matures. The extraverted (energetic) constituent declines while the introverted (informational) constituent rises. This maps onto the fundamental physics of dissipative structures: order is created by consuming energy, and when energy runs out, the structure must either be renewed from outside or collapse.</Prose>
        </Card>

        <div className="grid-4-2x2" style={{ gap: 10 }}>
          {[
            { q: Q.alpha, phase: "Genesis", season: "Spring", icon: "", level: "Energy Minimum", state: "Potential Energy", entropy: "Minimum", desc: "The initial stage of information gathering: the system builds potential energy, acting as a reservoir of concepts, theories, and emotional needs. Like a wound spring or charged battery, it is informationally rich but structurally undifferentiated, a soup of ideas without hierarchy. Kinetic output sits at its minimum while the quadra gathers knowledge, analyzes systems, and fosters a relaxed atmosphere.", analog: "Seed germination, Big Bang nucleosynthesis, brainstorming session, startup ideation" },
            { q: Q.beta, phase: "Mobilization", season: "Summer", icon: "", level: "Energy Rise", state: "Transition to Kinetic", entropy: "Rising Fast", desc: "The moment potential converts into kinetic energy: an active, driving, often forceful phase. Concepts and emotional passions, rallying ideals and ideologies, are translated into real-world action through mobilization, hierarchy formation, and disciplined execution. The system burns hot as it climbs toward maximum power output.", analog: "Explosive growth, imperial expansion, rocket launch, revolutionary movement" },
            { q: Q.gamma, phase: "Optimization", season: "Autumn", icon: "", level: "Energy Peak", state: "Kinetic Energy", entropy: "Near Maximum", desc: "The height of kinetic energy: the system is fully in motion, prioritizing practical results, material gains, and objective effectiveness. Ideas are heavily executed and resources actively spent to achieve tangible goals. Differentiation and specialization peak as individual units optimize locally through market mechanisms.", analog: "Mature capitalism, ecological succession, portfolio optimization, diplomatic realpolitik" },
            { q: Q.delta, phase: "Conservation", season: "Winter", icon: "", level: "Energy Decline", state: "Kinetic to Potential", entropy: "Controlled", desc: "Kinetic energy converts back into potential: the system shifts toward maintaining harmony, refining skills, improving craftsmanship, and sustaining long-term, stable relationships. Information is maximally ordered as the quadra enters a reflective maintenance mode, conserving and preparing resources for the next macro-cycle. Renewal eventually requires an external injection of Alpha-type novelty.", analog: "Climax ecosystem, cultural golden age, established tradition, well-run infrastructure" },
          ].map((p, i) => (
            <div key={i} style={{ background: `${p.q.color}06`, border: `1px solid ${p.q.color}20`, borderRadius: 12, padding: 16 }}>
              {p.icon && <div style={{ fontSize: 24, marginBottom: 6 }}>{p.icon}</div>}
              <div style={{ fontSize: 14, fontWeight: 700, color: p.q.color, marginBottom: 2, fontFamily: "'Playfair Display', Georgia, serif" }}>{p.q.greek} {p.phase} <span style={{ fontSize: 11, fontWeight: 400, fontStyle: "italic", color: C.textDim }}>({p.season})</span></div>
              <div style={{ display: "flex", gap: 6, marginBottom: 10, flexWrap: "wrap" }}>
                <Tag label={p.level} color={p.q.color} />
                <Tag label={p.state} color={p.q.color} />
              </div>
              <SmallProse style={{ color: C.textMuted, marginBottom: 10 }}>{p.desc}</SmallProse>
              <div style={{ fontSize: 10, color: C.textDim, fontStyle: "italic" }}><strong>Analogs:</strong> {p.analog}</div>
            </div>
          ))}
        </div>

        <Card style={{ marginTop: 16 }}>
          <SectionTitle color={C.rose}>The Lemniscate: Why the Cycle Doesn't Simply Repeat</SectionTitle>
          <Prose>The quadra cycle is not a simple circle but a <strong>spiral</strong> (or, in its fullest geometric expression, a lemniscate, a figure-eight). Each pass through the four phases occurs at a <em>higher level of complexity</em> than the last. Alpha₂ is not Alpha₁, the second round of genesis inherits the informational legacy of the entire preceding cycle. This is why civilizations don't simply repeat: Rome's Alpha (the mythical founding) is categorically different from Renaissance Italy's Alpha (the Florentine revival), even though both exhibit the characteristic curiosity, communalism, and structural fragility of the first quadra.</Prose>
          <Prose>The two benefit rings (Process/Right and Result/Left) represent the two halves of this figure-eight. The Process ring (Α→Β→Γ→Δ) follows the large-scale civilizational arc. The Result ring reverses certain local dynamics. Gulenko notes that on a large scale, Process types tend to lead and set tempo; on a small scale, Result types do. This dual-ring structure prevents the socion from being a simple one-directional clock, it oscillates between expansion and contraction, between macro-historical epochs and micro-historical corrections.</Prose>
        </Card>

        <Divider label="Benefit Rings as Energy-Information Metabolism" color={C.rose} />
        <Card>
          <SectionTitle color={C.rose}>Four Thermodynamic Roles in the Socion</SectionTitle>
          <Prose>The Benefit Ring does not merely connect types in a social-order chain. Gulenko identifies it as the socion's primary <strong>energy-information metabolism system</strong>. The 16 types divide into four groups of four based on their role in converting between energy and information. These groups cut across quadra boundaries, revealing the deeper thermodynamic substrate on which quadra succession operates.</Prose>
          <div className="grid-4-2x2" style={{ gap: 10 }}>
            {[
              { name: "Energy Generators", types: "ILE · EIE · LSE · SEE", color: C.accent4, desc: "Translate information into energy. They ignite energy processes in their environment, uniting small groups into larger ones and starting chain reactions in society. ILE and EIE are innovators and fighters for ideas; SEE and LSE draw people in for collective effects. They specialize in the energetics of large groups and are the most 'inflationary' types.", thermo: "Information → Energy" },
              { name: "Energy Carriers", types: "LIE · IEE · SLE · ESE", color: C.accent1, desc: "The most saturated with energy in the socion. They suffer from lack of fundamentally new information. Energizers of small groups who must break up large groups into smaller units to manage effectively. SLE and ESE solve concrete, immediate problems; IEE and LIE unite on the basis of romanticism, captivated by daring ideas.", thermo: "Energy storage + distribution" },
              { name: "Info Accumulators", types: "ILI · EII · LSI · SEI", color: C.accent2, desc: "Specialize in informatics of large groups but suffer from lack of energy. ILI accumulates scientific or philosophical information, LSI accumulates operational or managerial information (both make excellent collectors), EII accumulates humanitarian information, SEI accumulates social information.", thermo: "Energy → Information (absorbing)" },
              { name: "Info Generators", types: "LII · IEI · SLI · ESI", color: C.accent3, desc: "Translate energy into information. They function as stabilizers in the socion, specializing in informatics of small groups of similar-minded individuals. IEI and LII can unite a small group on the basis of novel interesting information; SLI and ESI engage in solving problems of survival and well-being.", thermo: "Energy → Information (crystallizing)" },
            ].map((g, i) => (
              <div key={i} style={{ background: `${g.color}06`, border: `1px solid ${g.color}18`, borderRadius: 10, padding: 16 }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: g.color, marginBottom: 2 }}>{g.name}</div>
                <div style={{ fontSize: 10, color: C.textDim, marginBottom: 4, fontFamily: "'JetBrains Mono', monospace" }}>{g.types}</div>
                <Tag label={g.thermo} color={g.color} />
                <SmallProse style={{ color: C.textMuted, marginTop: 10 }}>{g.desc}</SmallProse>
              </div>
            ))}
          </div>
          <SmallProse style={{ marginTop: 12, color: C.textMuted }}>Notice the asymmetry: Energy Generators and Carriers are extraverted-leading groups (high-energy), while Info Accumulators and Generators are introverted-leading groups (high-information). This maps directly onto Gulenko's core insight: extraversion is the energetic constituent, introversion is the informational constituent, and the quadra cycle converts between these two currencies. Each quadra contains one type from each of the four benefit-ring roles, ensuring every phase has access to all four metabolic functions.</SmallProse>
        </Card>

        <Card>
          <SectionTitle>Anti-Quadras: The Shadow Dynamics</SectionTitle>
          <Prose>Each quadra has an anti-quadra whose valued elements are precisely its subdued elements. Alpha's anti-quadra is Gamma; Beta's is Delta. Anti-quadras represent the <strong>maximum value tension</strong> in the socion, the civilizational orientations most difficult to reconcile. Alpha's open curiosity clashes with Gamma's selective pragmatism; Beta's hierarchical collectivism clashes with Delta's decentralized individualism. Yet each anti-quadra pair also contains the <em>complementary resources</em> the other most desperately needs: Alpha needs Gamma's ability to monetize; Gamma needs Alpha's ability to innovate without profit motive. Beta needs Delta's moral sustainability; Delta needs Beta's mobilization capacity.</Prose>
        </Card>
      </>}

      {/* FOOTER */}
      <div style={{ textAlign: "center", marginTop: 48, paddingTop: 24, borderTop: `1px solid ${C.border}` }}>
        <p style={{ fontSize: 10, color: C.textDim, letterSpacing: 1.5, fontFamily: "'JetBrains Mono', monospace" }}>
          SOURCES: Gulenko VV (Clock of the Socion, Quadral Estafette, Benefit Rings, Quadra Roles, SHS quadra articles) · Vincent V (Quadra Sociology, Model A, Dichotomy Spaces, Mandalas) · Talanov VL (socionavigator.com political values, axes, Cooperation/Competition statistics) · sociotype.xyz (dichotomy intercorrelations) · OpenSocionics · Wikisocion · Stratiyevskaya · Danidin · Beat (Tetrachotomy Compendium) · Cloninger CR (TCI) · DeYoung CG (Big Five Aspects) · HEXACO model
        </p>
      </div>
    </div>
  );
}

ReactDOM.render(<QuadraReport />, document.getElementById('root'));
