<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ontology of Socionics</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- React & Babel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  body { background: #08090e; color: #e4e4e7; overflow: hidden; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  /* Custom scrollbar for sidebar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: #3f3f5a; }
  iframe { display: block; width: 100%; height: 100%; border: none; background: #08090e; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect } = React;

  // Inline SVGs to ensure standalone reliability without bundlers
  const Icons = {
    Menu: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>,
    BookOpen: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>,
    SplitPath: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22v-9"></path><path d="M12 13c0-3-5-4-5-8V2"></path><path d="M12 13c0-3 5-4 5-8V2"></path><polyline points="4 5 7 2 10 5"></polyline><polyline points="14 5 17 2 20 5"></polyline></svg>,
    Zap: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>,
    Settings: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
    Heart: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>,
    Atom: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="1"></circle><ellipse cx="12" cy="12" rx="11" ry="4" transform="rotate(60 12 12)"></ellipse><ellipse cx="12" cy="12" rx="11" ry="4" transform="rotate(120 12 12)"></ellipse><ellipse cx="12" cy="12" rx="11" ry="4"></ellipse></svg>,
    Landmark: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="22" x2="21" y2="22"></line><line x1="6" y1="18" x2="6" y2="11"></line><line x1="10" y1="18" x2="10" y2="11"></line><line x1="14" y1="18" x2="14" y2="11"></line><line x1="18" y1="18" x2="18" y2="11"></line><polygon points="12 2 20 7 4 7"></polygon></svg>,
    Globe: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>,
    YinYang: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a5 5 0 0 0 0 10 5 5 0 0 1 0 10"></path><circle cx="12" cy="7" r="1"></circle><circle cx="12" cy="17" r="1"></circle></svg>,
    Network: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"></rect><rect x="2" y="16" width="6" height="6" rx="1"></rect><rect x="9" y="2" width="6" height="6" rx="1"></rect><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"></path><path d="M12 12V8"></path></svg>,
    Lock: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
  };

  const App = () => {
    // Initial sidebar state: stored preference wins; otherwise responsive default
    // (expanded ≥768px, collapsed below). This matches Tailwind's md breakpoint and
    // mirrors how production tools like Notion/Linear behave on first visit.
    const getInitialSidebar = () => {
      if (typeof window === 'undefined') return true;
      try {
        const stored = window.localStorage.getItem('ontology-sidebar-open');
        if (stored !== null) return stored === 'true';
      } catch (e) { /* localStorage disabled (private mode, etc.) */ }
      return window.innerWidth >= 768;
    };
    const [sidebarOpen, setSidebarOpen] = useState(getInitialSidebar);
    const toggleSidebar = () => {
      setSidebarOpen(prev => {
        const next = !prev;
        try { window.localStorage.setItem('ontology-sidebar-open', String(next)); } catch (e) {}
        return next;
      });
    };
    
    // Map your 10 articles here. 
    // The `file` property MUST match the exact filename in your folder.
    const articles = [
      { id: 'overview', title: '1. Foundations & Dichotomies', icon: <Icons.BookOpen />, file: 'OVERVIEW_FINAL.html', available: true },
      { id: 'dichotomies', title: '2. Dichotomies (Traits)', icon: <Icons.SplitPath />, file: 'DICHOTOMIES_FINAL.html', available: true },
      { id: 'temperaments', title: '3. Temperaments (Rhythms)', icon: <Icons.Zap />, file: 'TEMPERAMENT_FINAL.html', available: true },
      { id: 'clubs', title: '4. Clubs (Jungian Aspects)', icon: <Icons.Settings />, file: 'CLUB_FINAL.html', available: true },
      { id: 'quadras', title: '5. Quadra Values (Axes)', icon: <Icons.Heart />, file: 'QUADRA_FINAL.html', available: true },
      { id: 'elements', title: '6. Elements (Functions)', icon: <Icons.Atom />, file: 'ELEMENTS_FINAL.html', available: true },
      { id: 'models', title: '7. Models (Slots & Blocks)', icon: <Icons.Landmark />, file: 'MODELS_FINAL.html', available: true },
      { id: 'socion', title: '8. The Socion (Circumplex)', icon: <Icons.Globe />, file: 'CIRCUMPLEX_FINAL.html', available: true },
      { id: 'relations', title: '9. Relations (ITRs)', icon: <Icons.YinYang />, file: 'ITR_FINAL.html', available: true },
      { id: 'subtypes', title: '10. Subtypes (DCNH)', icon: <Icons.Network />, file: 'DCNH_FINAL.html', available: true },
    ];

    const [activeArticle, setActiveArticle] = useState(articles[0]);

    return (
      <div className="flex h-screen bg-[#08090e] text-[#e4e4e7] overflow-hidden">
        
        {/* Sidebar */}
        <div className={`flex-shrink-0 bg-[#10111a] border-r border-[#252538] transition-all duration-300 ease-in-out flex flex-col z-20 relative ${sidebarOpen ? 'w-72' : 'w-16'}`}>
          
          {/* Header Area */}
          <div className="h-[60px] flex items-center justify-between px-4 border-b border-[#252538]">
            {sidebarOpen && (
              <span className="font-['Playfair_Display'] font-bold text-[17px] tracking-wide bg-gradient-to-r from-gray-200 to-gray-400 bg-clip-text text-transparent truncate select-none">
                Ontology of Socionics
              </span>
            )}
            <button 
              onClick={toggleSidebar}
              className="p-1.5 rounded-lg hover:bg-[#252538] text-gray-400 hover:text-white transition-colors"
            >
              <Icons.Menu />
            </button>
          </div>

          {/* Navigation Links */}
          <div className="flex-1 overflow-y-auto py-4 px-2 flex flex-col gap-1">
            {sidebarOpen && <div className="px-3 pb-2 text-[10px] font-['JetBrains_Mono'] tracking-[0.15em] text-gray-500 uppercase select-none">Documents</div>}
            
            {articles.map((item) => {
              const isActive = activeArticle.id === item.id;
              return (
                <button
                  key={item.id}
                  disabled={!item.available}
                  onClick={() => setActiveArticle(item)}
                  className={`
                    w-full flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all text-[13px] relative
                    ${!item.available ? 'opacity-40 cursor-not-allowed' : 'cursor-pointer hover:bg-[#1a1b26]'}
                    ${isActive ? 'bg-[#1a1b26] text-white font-semibold' : 'text-gray-400'}
                    ${!sidebarOpen && 'justify-center'}
                  `}
                  title={!sidebarOpen ? item.title : undefined}
                >
                  <span className={`flex-shrink-0 flex items-center justify-center ${isActive ? 'text-[#c8a0ff]' : ''}`}>
                    {item.icon}
                  </span>
                  {sidebarOpen && <span className="truncate text-left flex-1">{item.title}</span>}
                  
                  {/* Lock Icon overlay for unavailable items */}
                  {sidebarOpen && !item.available && (
                    <span className="text-gray-600 flex-shrink-0 ml-2">
                      <Icons.Lock />
                    </span>
                  )}
                </button>
              );
            })}
          </div>
        </div>

        {/* Floating Toggle Button (visible only when sidebar is closed to match Gemini UI) */}
        {!sidebarOpen && (
          <div className="absolute top-[14px] left-4 z-30">
            {/* The button in the narrow sidebar handles the opening, but we keep this space clear */}
          </div>
        )}

        {/* Main Viewing Pane (Iframe) */}
        <div className="flex-1 h-full bg-[#08090e] relative z-10">
          {activeArticle.available ? (
            <iframe 
              src={activeArticle.file} 
              title={activeArticle.title}
              sandbox="allow-scripts allow-same-origin"
            ></iframe>
          ) : (
            <div className="flex items-center justify-center h-full text-gray-500 font-['JetBrains_Mono'] text-sm">
              Document locked or not yet available.
            </div>
          )}
        </div>
      </div>
    );
  };

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
